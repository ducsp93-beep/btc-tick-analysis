name: BTC Tick Analyzer

on:
  # 11:00 UTC = 18:00 (6 PM) in Vietnam (ICT, UTC+7). Adjust for your timezone
  # if different. GitHub cron times are always UTC and are "best effort" -
  # expect a few minutes of drift, especially during busy periods.
  schedule:
    - cron: "5 11 * * *"
  # Lets you also start it by hand from the Actions tab, any time.
  workflow_dispatch: {}

# No top-level `concurrency` block here on purpose: concurrency would queue
# a second run instead of starting it, which stops the guard step below
# from ever seeing it and deciding what to do. The guard step is what
# enforces "manual always wins" instead.

permissions:
  actions: read
  contents: read

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    # Hard safety net: the job is killed here no matter what, so a manual
    # run and the scheduled run both last at most 3 hours.
    timeout-minutes: 180
    steps:
      - name: Decide whether to run or skip
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          THIS_RUN_ID: ${{ github.run_id }}
        run: |
          resp=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/btc-analyzer.yml/runs?status=in_progress")

          # IDs of any OTHER in-progress runs (excluding this one).
          other_ids=$(echo "$resp" | python3 -c "
import json, sys
data = json.load(sys.stdin)
ids = [str(r['id']) for r in data.get('workflow_runs', []) if str(r['id']) != '$THIS_RUN_ID']
print('\n'.join(ids))
")
          other_count=$(echo "$other_ids" | grep -c . || true)
          echo "Other in-progress runs: $other_count"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual runs always take priority: never skip, and cancel any
            # scheduled run that happened to already be active.
            echo "skip=false" >> "$GITHU
